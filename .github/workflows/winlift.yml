name: WinLift

on:
  push:
    paths:
      - 'WinLift/**'
      - '.github/workflows/winlift.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: WinLift

jobs:
  macos:
    name: macOS 14 Apple Silicon · swift test + app launch
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and architecture
        run: |
          uname -m
          swift --version
      - name: swift test
        run: swift test
      - name: Build app bundle and verify launch
        run: ./script/build_and_run.sh --verify
      - name: Capture rendered WinLift window
        run: |
          sleep 4
          /usr/bin/osascript -e 'tell application "WinLift" to activate' || true
          # Activation can trigger the first full SwiftUI draw on hosted runners.
          # Give that draw a brief stabilization window before capturing pixels.
          sleep 2
          screenshot="$RUNNER_TEMP/WinLift-main-window.png"
          window_id="$(/usr/bin/osascript -e 'tell application "System Events" to tell process "WinLift" to get value of attribute "AXWindowNumber" of window 1' 2>/dev/null || true)"
          if [[ "$window_id" =~ ^[0-9]+$ ]]; then
            /usr/sbin/screencapture -x -o -l "$window_id" "$screenshot" \
              || /usr/sbin/screencapture -x "$screenshot"
          else
            /usr/sbin/screencapture -x "$screenshot"
          fi
          test -s "$screenshot"
      - name: Upload WinLift UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winlift-ui-${{ github.run_number }}
          path: ${{ runner.temp }}/WinLift-main-window.png
          if-no-files-found: error
      - name: Shut down app
        if: always()
        run: pkill -x WinLift || true

  linux-core:
    name: Linux · core tests + QEMU TCG smoke
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and firmware
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-efi-aarch64 python3
      - name: swift test (WinLiftCore)
        run: swift test
      - name: QEMU smoke test with generated arguments
        run: python3 script/qemu_smoke_linux.py
